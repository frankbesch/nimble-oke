<text x="40" y="650" font-size="12" fill="#6A625A">Watchdog action</text>
<rect x="188" y="640" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="212" y="650" font-size="12" fill="#6A625A">Clean exit</text>
<rect x="16" y="662" width="16" height="11" rx="2.5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="40" y="672" font-size="12" fill="#6A625A">Manual follow-up</text>
