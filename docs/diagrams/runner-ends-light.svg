<text x="270" y="361" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Watchdog teardown</text>
<text x="270" y="379" font-size="12" fill="#6A625A" text-anchor="middle">runner died or</text>
<text x="270" y="395" font-size="12" fill="#6A625A" text-anchor="middle">time limit</text>
<rect x="16" y="464" width="148" height="54" rx="5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="90" y="487" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Exit 0</text>
<text x="90" y="505" font-size="12" fill="#6A625A" text-anchor="middle">cluster deleted</text>
<rect x="196" y="464" width="148" height="102" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="270" y="487" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Exit non-zero</text>
<text x="270" y="505" font-size="12" fill="#6A625A" text-anchor="middle">prints oci delete</text>
<text x="270" y="521" font-size="12" fill="#6A625A" text-anchor="middle">commands</text>
<text x="270" y="537" font-size="12" fill="#2B2926" text-anchor="middle">watchdog stays</text>
