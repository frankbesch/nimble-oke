<rect x="259.0" y="229" width="82.0" height="18" rx="3" fill="#FCFBF9"/><text x="300" y="242" font-size="12" fill="#6A625A" text-anchor="middle">takes over</text>
<path d="M196 365 L164 365" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="172,360 172,370 164,365" fill="#6A625A"/>
<path d="M60 392 L60 464" fill="none" stroke="#33703F" stroke-width="2"/><polygon points="55,456 65,456 60,464" fill="#33703F"/>
<rect x="66.0" y="401" width="31.6" height="18" rx="3" fill="#FCFBF9"/><text x="70" y="414" font-size="12" fill="#6A625A">yes</text>
<path d="M120 392 L120 442 L270 442 L270 464" fill="none" stroke="#90302B" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="265,456 275,456 270,464" fill="#90302B"/>
<rect x="126.0" y="401" width="24.4" height="18" rx="3" fill="#FCFBF9"/><text x="130" y="414" font-size="12" fill="#6A625A">no</text>
<rect x="16" y="42" width="148" height="70" rx="5" fill="#EBE6DD" stroke="#90302B" stroke-width="1.5"/>
<text x="90" y="65" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Preflight</text>
<text x="90" y="83" font-size="12" fill="#6A625A" text-anchor="middle">timeouts fit the</text>
<text x="90" y="99" font-size="12" fill="#6A625A" text-anchor="middle">limit</text>
<rect x="196" y="42" width="148" height="54" rx="5" fill="#EBE6DD" stroke="#90302B" stroke-width="1.5"/>
<text x="270" y="65" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Arm watchdog</text>
<text x="270" y="83" font-size="12" fill="#6A625A" text-anchor="middle">before any cost</text>
