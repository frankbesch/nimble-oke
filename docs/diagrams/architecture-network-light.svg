<svg viewBox="0 0 360 611" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Port forward tunnel</title>
<desc>The port forward tunnels localhost:8000 on your machine through kubectl port-forward svc/nvidia-nim 8000:8000 and the Kubernetes API server on the OKE control plane, which authenticates the tunnel, to the GPU node (VM.GPU.A10.1, one A10, pool size 0 to 1) and port 8000 on the NIM pod. The system node, one VM.Standard.E4.Flex with 2 OCPU and 16 GB, runs cluster DNS and the autoscaler.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="611" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Port forward tunnel</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<rect x="16" y="56" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Your machine</text>
<text x="180" y="97" font-size="12" fill="#6A625A" text-anchor="middle">localhost:8000</text>
<path d="M180 112 L180 150" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,142 185,142 180,150" fill="#6A625A"/>
<rect x="16" y="154" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#6A625A" stroke-width="1.5"/>
<text x="180" y="177" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">kubectl port-forward</text>
<text x="180" y="195" font-size="12" fill="#6A625A" text-anchor="middle">svc/nvidia-nim 8000:8000</text>
<path d="M180 210 L180 248" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,240 185,240 180,248" fill="#6A625A"/>
<rect x="16" y="252" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#0084A9" stroke-width="1.5"/>
<text x="180" y="275" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">Kubernetes API server</text>
<text x="180" y="293" font-size="12" fill="#6A625A" text-anchor="middle">OKE control plane;</text>
<text x="180" y="309" font-size="12" fill="#2B2926" text-anchor="middle">authenticates the tunnel</text>
<path d="M180 324 L180 362" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,354 185,354 180,362" fill="#6A625A"/>
<rect x="16" y="366" width="328" height="70" rx="5" fill="#EBE6DD" stroke="#916A0B" stroke-width="1.5"/>
<text x="180" y="389" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">GPU node</text>
<text x="180" y="407" font-size="12" fill="#6A625A" text-anchor="middle">VM.GPU.A10.1, one A10,</text>
<text x="180" y="423" font-size="12" fill="#2B2926" text-anchor="middle">pool size 0 to 1</text>
<path d="M180 438 L180 476" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="175,468 185,468 180,476" fill="#6A625A"/>
<rect x="16" y="480" width="328" height="54" rx="5" fill="#EBE6DD" stroke="#33703F" stroke-width="1.5"/>
<text x="180" y="503" font-size="12.5" fill="#2B2926" text-anchor="middle" font-weight="600">NIM pod</text>
<text x="180" y="521" font-size="12" fill="#6A625A" text-anchor="middle">port 8000</text>
<text x="16" y="560" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>The system node, one VM.Standard.E4.Flex with 2 OCPU and</text>
<text x="16" y="577" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>16 GB, runs cluster DNS and the autoscaler; the tunnel does</text>
<text x="16" y="594" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>not pass through it.</text>
</svg>
