<svg viewBox="0 0 360 574" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>Posted list cost, OKE and GKE</title>
<desc>Posted list cost on one dollar scale. Fixed pool: $0.63 on OKE; about $0.70 on GKE for the day&#x27;s two runs. Autoscale: $0.53 on OKE; about $0.50 on GKE for the day, with one failed start. Every start: $1.17 on OKE; $1.19 on GKE, of which $0.95 was charged after credits.</desc>
