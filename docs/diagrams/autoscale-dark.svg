<svg viewBox="0 0 360 696" xmlns="http://www.w3.org/2000/svg" role="img" font-family='ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>GPU node autoscaling, 0 to 1 to 0</title>
<desc>The GPU node pool starts at 0 nodes. The NIM pod goes Pending and asks for one GPU. The GPU node is Ready 385 s later. NIM serves 5 of 5 requests, then replicas are set to 0. The pool is back at 0 nodes 312 s after that.</desc>
<rect width="360" height="696" rx="6" fill="#0E1C2B"/>
<text x="16" y="30" font-size="15" fill="#E8E2D6" font-weight="600">GPU node autoscaling, 0 to 1 to 0</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#2D4152"/>
<rect x="16" y="54" width="328" height="57" rx="4" fill="#1F3142" stroke="#6DA361"/>
<text x="30" y="78.5" font-size="13" fill="#E8E2D6" font-weight="600">Pool at 0 nodes</text>
<text x="30" y="96.5" font-size="12" fill="#A8A296">cluster up, no GPU</text>
<path d="M40 115 L40 178" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,170 45,170 40,178" fill="#A8A296"/>
<rect x="16" y="182" width="328" height="57" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="206.5" font-size="13" fill="#E8E2D6" font-weight="600">NIM pod Pending</text>
<text x="30" y="224.5" font-size="12" fill="#A8A296">asks for one GPU</text>
<path d="M40 243 L40 306" fill="none" stroke="#6DA361" stroke-width="2"/><polygon points="35,298 45,298 40,306" fill="#6DA361"/>
<text x="58" y="279.5" font-size="13" fill="#E8E2D6" font-weight="600">scale-up: 385 s</text>
<rect x="16" y="310" width="328" height="57" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="334.5" font-size="13" fill="#E8E2D6" font-weight="600">GPU node Ready</text>
<text x="30" y="352.5" font-size="12" fill="#A8A296">autoscaler added it</text>
<path d="M40 371 L40 434" fill="none" stroke="#A8A296" stroke-width="1.5"/><polygon points="35,426 45,426 40,434" fill="#A8A296"/>
<rect x="16" y="438" width="328" height="57" rx="4" fill="#1F3142" stroke="#2D4152"/>
<text x="30" y="462.5" font-size="13" fill="#E8E2D6" font-weight="600">NIM serving</text>
<text x="30" y="480.5" font-size="12" fill="#A8A296">5 of 5, then replicas 0</text>
<path d="M40 499 L40 562" fill="none" stroke="#17A1C8" stroke-width="2"/><polygon points="35,554 45,554 40,562" fill="#17A1C8"/>
<text x="58" y="535.5" font-size="13" fill="#E8E2D6" font-weight="600">scale-down: 312 s</text>
<rect x="16" y="566" width="328" height="57" rx="4" fill="#1F3142" stroke="#6DA361"/>
<text x="30" y="590.5" font-size="13" fill="#E8E2D6" font-weight="600">Pool back at 0</text>
<text x="30" y="608.5" font-size="12" fill="#A8A296">autoscaler removed it</text>
<text x="16" y="645" font-size="12" fill="#A8A296">Run 2, 2026-10-01, one VM.GPU.A10.1. Measured</text>
<text x="16" y="662" font-size="12" fill="#A8A296">once. Scale-down ran with the autoscaler</text>
<text x="16" y="679" font-size="12" fill="#A8A296">timers set to 3 minutes.</text>
</svg>
