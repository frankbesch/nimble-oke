<svg viewBox="0 0 360 696" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>GPU node autoscaling, 0 to 1 to 0</title>
<desc>The GPU node pool starts at 0 nodes. The NIM pod goes Pending and asks for one GPU. The GPU node is Ready 385 s later. NIM serves 5 of 5 requests, then replicas are set to 0. The pool is back at 0 nodes 312 s after that.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="696" rx="6" fill="#FCFBF9"/>
<text x="16" y="30" font-size="15" fill="#2B2926" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>GPU node autoscaling, 0 to 1 to 0</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#D2CCC3"/>
<rect x="16" y="54" width="328" height="58" rx="4" fill="#EBE6DD" stroke="#33703F"/>
<text x="30" y="79" font-size="13" fill="#2B2926" font-weight="600">Pool at 0 nodes</text>
<text x="30" y="97" font-size="12" fill="#6A625A">cluster up, no GPU</text>
<path d="M40 116 L40 182" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="35,174 45,174 40,182" fill="#6A625A"/>
<rect x="16" y="186" width="328" height="58" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="211" font-size="13" fill="#2B2926" font-weight="600">NIM pod Pending</text>
<text x="30" y="229" font-size="12" fill="#6A625A">asks for one GPU</text>
<path d="M40 248 L40 314" fill="none" stroke="#33703F" stroke-width="2"/><polygon points="35,306 45,306 40,314" fill="#33703F"/>
<text x="58" y="286" font-size="13" fill="#2B2926" font-weight="600">scale-up: 385 s</text>
<rect x="16" y="318" width="328" height="58" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="343" font-size="13" fill="#2B2926" font-weight="600">GPU node Ready</text>
<text x="30" y="361" font-size="12" fill="#6A625A">autoscaler added it</text>
<path d="M40 380 L40 446" fill="none" stroke="#6A625A" stroke-width="1.5"/><polygon points="35,438 45,438 40,446" fill="#6A625A"/>
<rect x="16" y="450" width="328" height="58" rx="4" fill="#EBE6DD" stroke="#6A625A"/>
<text x="30" y="475" font-size="13" fill="#2B2926" font-weight="600">NIM serving</text>
<text x="30" y="493" font-size="12" fill="#6A625A">5 of 5, then replicas 0</text>
<path d="M40 512 L40 578" fill="none" stroke="#0084A9" stroke-width="2"/><polygon points="35,570 45,570 40,578" fill="#0084A9"/>
<text x="58" y="550" font-size="13" fill="#2B2926" font-weight="600">scale-down: 312 s</text>
<rect x="16" y="582" width="328" height="58" rx="4" fill="#EBE6DD" stroke="#33703F"/>
<text x="30" y="607" font-size="13" fill="#2B2926" font-weight="600">Pool back at 0</text>
<text x="30" y="625" font-size="12" fill="#6A625A">autoscaler removed it</text>
<text x="16" y="662" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Run 2, 2026-10-01, one VM.GPU.A10.1. Measured once.</text>
<text x="16" y="679" font-size="12" fill="#6A625A" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>Scale-down ran with the autoscaler timers set to 3 minutes.</text>
</svg>
