<rect x="150.0" y="264" width="330.0" height="22" rx="2" fill="#1F3142"/>
<rect x="150.0" y="264" width="330.0" height="22" rx="2" fill="#6DA361"/>
<text x="150" y="300" font-size="11.5" fill="#E8E2D6">23 min 04 s</text>
