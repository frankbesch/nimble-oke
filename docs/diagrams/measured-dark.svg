<rect x="620.0" y="114" width="330.0" height="22" rx="2" fill="#1F3142"/>
<rect x="620.0" y="114" width="136.9" height="22" rx="2" fill="#6DA361"/>
<text x="620" y="150" font-size="11.5" fill="#E8E2D6">312 s, timers set to 3 min</text>
