{{- $apiKey := required "ngc.apiKey is required: supply it in a values file kept out of git (mode 600) or on stdin (-f -); never --set, which puts the key in argv and shell history" .Values.ngc.apiKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nvidia-nim.imagePullSecretName" . }}
  labels:
    {{- include "nvidia-nim.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\"}}}" .Values.ngc.registry .Values.ngc.username $apiKey | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nvidia-nim.ngcApiSecretName" . }}
  labels:
    {{- include "nvidia-nim.labels" . | nindent 4 }}
type: Opaque
data:
  NGC_API_KEY: {{ $apiKey | b64enc }}

