apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nvidia-nim.fullname" . }}
  labels:
    {{- include "nvidia-nim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Always rendered. Default Recreate: one GPU and a ReadWriteOnce PVC cannot
  # be shared by an old and a new pod at the same time.
  strategy:
    {{- toYaml (default (dict "type" "Recreate") .Values.strategy) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "nvidia-nim.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nvidia-nim.selectorLabels" . | nindent 8 }}
        {{- with .Values.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        - name: {{ include "nvidia-nim.imagePullSecretName" . }}
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      serviceAccountName: {{ include "nvidia-nim.serviceAccountName" . }}
      {{- /* Render the whole block so falsy values such as runAsUser: 0 are kept. */}}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "nvidia-nim.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
      - name: nvidia-nim
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: NGC_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nvidia-nim.ngcApiSecretName" . }}
              key: NGC_API_KEY
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: model-cache
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        {{- if .Values.sharedMemory.enabled }}
        - name: dshm
          mountPath: /dev/shm
        {{- end }}
        {{- if .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if .Values.startupProbe }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: model-cache
        persistentVolumeClaim:
          claimName: {{ include "nvidia-nim.fullname" . }}-model-cache
      {{- end }}
      {{- if .Values.sharedMemory.enabled }}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ .Values.sharedMemory.sizeLimit }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

