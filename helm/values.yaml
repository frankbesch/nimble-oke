# NIM Deployment Configuration
# Meta Llama 3 8B Instruct (image nim/meta/llama3-8b-instruct:1.0.3) on OKE

replicaCount: 1

# Deployment strategy - always rendered by templates/deployment.yaml.
# Recreate stops the old pod before the new one starts. A single GPU and a
# ReadWriteOnce PVC cannot be held by two pods at once.
strategy:
  type: Recreate

image:
  registry: nvcr.io
  repository: nim/meta/llama3-8b-instruct
  tag: "1.0.3"
  pullPolicy: IfNotPresent

# Extra, pre-existing pull secrets only. The chart always adds its own NGC
# pull secret, named "<release fullname>-ngc-registry".
imagePullSecrets: []

# The chart renders two Secrets from ngc.apiKey:
#   <release fullname>-ngc-api       (Opaque, key NGC_API_KEY, read by the container)
#   <release fullname>-ngc-registry  (dockerconfigjson, used to pull from nvcr.io)
# ngc.apiKey is required; rendering fails without it.
ngc:
  apiKey: "" # supplied at install time: --set ngc.apiKey=$NGC_API_KEY or a values file kept out of git
  registry: nvcr.io
  username: "$oauthtoken"

resources:
  # Simplified resource allocation for stability
  # Single GPU configuration for cost optimization
  limits:
    nvidia.com/gpu: 1
    memory: "24Gi"
    cpu: "8"
    ephemeral-storage: "200Gi"  # Updated to 200Gi+ for NIM model loading
  requests:
    nvidia.com/gpu: 1
    memory: "16Gi"
    cpu: "4"
    ephemeral-storage: "100Gi"  # Updated to 100Gi for NIM model loading

service:
  type: ClusterIP  # Cost optimization - use port-forward for testing
  port: 8000
  targetPort: 8000
  # externalTrafficPolicy removed for ClusterIP
  annotations:
    # LoadBalancer annotations removed for cost savings

# Extra container env. NGC_API_KEY is added by the template from the
# "<release fullname>-ngc-api" Secret; do not repeat it here.
env:
  - name: NIM_CACHE_PATH
    value: "/model-cache"
  - name: NIM_MODEL_PROFILE
    value: "auto"

persistence:
  enabled: true  # ENABLED to bypass ephemeral storage limits
  storageClass: "oci-bv"
  accessMode: ReadWriteOnce
  size: 100Gi  # Sufficient for NIM model storage
  mountPath: /model-cache

# Security context - NOT HARDENED.
# Pod level: nothing is set. The container runs as the image's default user,
# with no fsGroup and no seccomp profile. This is the configuration the
# deployment has actually run with. (Earlier values listed runAsNonRoot: false,
# runAsUser: 0 and fsGroup: 0, but the old template dropped them because they
# are falsy, so they were never applied.) The template renders this map as-is,
# so any key set here, including runAsUser: 0, is applied.
podSecurityContext: {}

# Container level: only readOnlyRootFilesystem: false is applied (NIM writes
# temp files). Privilege escalation is allowed and no capabilities are dropped.
# Hardening (allowPrivilegeEscalation: false, capabilities.drop: [ALL],
# seccompProfile: RuntimeDefault, runAsNonRoot: true) is untested with NIM.
securityContext:
  readOnlyRootFilesystem: false

nodeSelector:
  nvidia.com/gpu.present: "true"  # Flexible GPU selection (any NVIDIA GPU)
  # Oracle list price is $2.00 per A10 GPU-hour:
  #   VM.GPU.A10.1 (1x A10) = $2.00/hour; VM.GPU.A10.2 (2x A10) = $4.00/hour.
  #   The 4-GPU A10 shape is bare metal: BM.GPU.A10.4.

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: In
              values:
                - "true"

topologySpreadConstraints:
  enabled: false  # DISABLED for single-zone development/testing
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway  # Allow scheduling even if constraints can't be met
  # TODO: Enable for production multi-zone deployments

# Health Probes - startupProbe covers the first model download.
# Startup window = periodSeconds x failureThreshold = 10 s x 120 = 1200 s (20 min).
# Readiness and liveness probes do not run until the startup probe succeeds.
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  failureThreshold: 120
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# Monitoring - SIMPLIFIED for initial deployment
podAnnotations:
  # prometheus.io/scrape: "true"      # Temporarily disabled
  # prometheus.io/port: "8000"        # Temporarily disabled
  # prometheus.io/path: "/metrics"    # Temporarily disabled

serviceAccount:
  create: true
  annotations:
    oci.oraclecloud.com/principal-type: "instance"
  name: "nim-service-account"

labels:
  app.kubernetes.io/name: nvidia-nim
  app.kubernetes.io/component: inference
  app.kubernetes.io/part-of: nim-deployment

# Cost Optimization - DISABLED for initial deployment
# costOptimization:
#   scheduleDowntime: false

