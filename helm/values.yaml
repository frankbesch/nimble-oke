# NIM Deployment Configuration
# Meta Llama 3.1 8B Instruct on OKE

replicaCount: 1

# Pod Limiter Configuration - TEMPORARILY DISABLED for stability
podLimiter:
  enabled: false  # Disabled for initial deployment stability
  maxFailedPods: 3
  maxPendingPods: 2
  cleanupInterval: "5m"
  # Rolling update strategy - CRITICAL: maxSurge=0 prevents pod explosion
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# Deployment Strategy - Use Recreate to prevent eviction loops
strategy:
  type: Recreate  # Prevents rolling update issues with storage-intensive workloads

image:
  registry: nvcr.io
  repository: nim/meta/llama3-8b-instruct
  tag: "1.0.3"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ngc-secret

ngc:
  apiKey: "MnZ0a2k0ZzlyamhjMjFramloczczdmRxMm86MWYxN2JmZTQtY2M5OS00Y2U5LThiYTUtYmU0ODYZOGE2ODM1"
  registry: nvcr.io
  username: "$oauthtoken"

resources:
  # Simplified resource allocation for stability
  # Single GPU configuration for cost optimization
  limits:
    nvidia.com/gpu: 1
    memory: "24Gi"
    cpu: "8"
    ephemeral-storage: "200Gi"  # Updated to 200Gi+ for NIM model loading
  requests:
    nvidia.com/gpu: 1
    memory: "16Gi"
    cpu: "4"
    ephemeral-storage: "100Gi"  # Updated to 100Gi for NIM model loading

# Model-specific configuration
model:
  name: "meta/llama3-8b-instruct"
  ngcAPISecret: "ngc-api"
  sizeGB: 50  # Model size for cache planning

service:
  type: ClusterIP  # Cost optimization - use port-forward for testing
  port: 8000
  targetPort: 8000
  # externalTrafficPolicy removed for ClusterIP
  annotations:
    # LoadBalancer annotations removed for cost savings

env:
  - name: NIM_CACHE_PATH
    value: "/model-cache"
  - name: NIM_MODEL_PROFILE
    value: "auto"
  - name: NGC_API_KEY
    valueFrom:
      secretKeyRef:
        name: nvidia-nim-ngc-api
        key: NGC_API_KEY

persistence:
  enabled: true  # ENABLED to bypass ephemeral storage limits
  storageClass: "oci-bv"
  accessMode: ReadWriteOnce
  size: 100Gi  # Sufficient for NIM model storage
  mountPath: /model-cache

# Security Context - SIMPLIFIED for initial deployment
podSecurityContext:
  runAsNonRoot: false  # Disabled for NIM GPU compatibility
  runAsUser: 0         # Root user required for NIM GPU access
  fsGroup: 0           # Root group required for NIM GPU access
  # seccompProfile: disabled - REQUIRED for NIM GPU compatibility

securityContext:
  # allowPrivilegeEscalation: false  # Temporarily disabled for NIM compatibility
  # capabilities:                    # Temporarily disabled for NIM compatibility
  #   drop:
  #     - ALL
  readOnlyRootFilesystem: false  # NIM requires writable filesystem for temp files and cache

nodeSelector:
  nvidia.com/gpu.present: "true"  # Flexible GPU selection (any NVIDIA GPU)
  # VM.GPU.A10.2 provides 2x NVIDIA A10 GPUs (~$6.12/hour)

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/disk-pressure
    operator: Exists
    effect: NoSchedule

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.present
              operator: In
              values:
                - "true"

topologySpreadConstraints:
  enabled: false  # DISABLED for single-zone development/testing
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway  # Allow scheduling even if constraints can't be met
  # TODO: Enable for production multi-zone deployments

# Health Probes - Enhanced with startupProbe for NIM model loading
startupProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  failureThreshold: 30  # 5 minutes for model download
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /v1/health/ready
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /v1/health/live
    port: 8000
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# Autoscaling - DISABLED for initial deployment
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Monitoring - SIMPLIFIED for initial deployment
podAnnotations:
  # prometheus.io/scrape: "true"      # Temporarily disabled
  # prometheus.io/port: "8000"        # Temporarily disabled
  # prometheus.io/path: "/metrics"    # Temporarily disabled

serviceAccount:
  create: true
  annotations:
    oci.oraclecloud.com/principal-type: "instance"
  name: "nim-service-account"

labels:
  app.kubernetes.io/name: nvidia-nim
  app.kubernetes.io/component: inference
  app.kubernetes.io/part-of: nim-deployment

# Cost Optimization - DISABLED for initial deployment
# costOptimization:
#   scheduleDowntime: false

